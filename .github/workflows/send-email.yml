name: Send Contact Email from Issue

on:
  issues:
    types: [opened]

jobs:
  send-email:
    if: startsWith(github.event.issue.title, '[Contact Form]')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Nodemailer
        run: npm install nodemailer

      - name: Send Email & Close Issue
        uses: actions/github-script@v6
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        with:
          script: |
            const nodemailer = require('nodemailer');
            const payload = JSON.parse(process.env.ISSUE_BODY);

            const transporter = nodemailer.createTransport({
              service: 'gmail',
              auth: {
                user: process.env.GMAIL_USER,
                pass: process.env.GMAIL_APP_PASS,
              },
            });

            const mailOptions = {
              from: payload.email,
              to: process.env.GMAIL_USER,
              subject: `[Portfolio Contact] ${payload.subject}`,
              html: `
                <h3>New message from Portfolio!</h3>
                <p><strong>Name:</strong> ${payload.name}</p>
                <p><strong>Email:</strong> ${payload.email}</p>
                <p><strong>Subject:</strong> ${payload.subject}</p>
                <p><strong>Message:</strong></p>
                <p>${payload.message}</p>
              `,
            };

            try {
              // 1. Send Email
              await transporter.sendMail(mailOptions);
              console.log('Email sent successfully!');

              // 2. Auto-close Issue to clean up the repo
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: process.env.ISSUE_NUMBER,
                state: 'closed'
              });
            } catch (error) {
              console.error('Error:', error);
              core.setFailed(error.message);
            }